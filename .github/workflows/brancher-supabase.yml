# Créno : installe tout seul la partie serveur dans Supabase (pas besoin d'ordinateur).
#
# Se lance à chaque modification du dossier supabase/, ou à la main :
# onglet Actions > « Brancher Supabase » > Run workflow.
#   1. crée ou met à jour les tables (fichiers de supabase/migrations, via l'API Supabase)
#   2. déploie les 4 fonctions serveur (alertes, pack, stats, pros), sans vérification JWT
#   3. copie dans Supabase les secrets des fonctions réglés sur GitHub
#   4. remplit assets/config.js (adresse du projet + clé publique) s'il est encore vide
#   5. règle la connexion des comptes (Supabase Auth) : adresse du site, mot de passe, e-mails par Resend si branché
# Le résultat de chaque étape (et l'erreur exacte s'il y en a une) s'affiche sur la page
# « Summary » du lancement.
#
# Secrets à régler sur GitHub : Settings > Secrets and variables > Actions > New repository secret
#   SUPABASE_ACCESS_TOKEN   jeton d'accès (supabase.com > Account > Access Tokens)
#   SUPABASE_PROJECT_ID     identifiant du projet (l'adresse https://xxxx.supabase.co marche aussi)
#   ADMIN_CODE, ADMIN_EMAIL code du tableau de bord /admin/ et e-mail qui reçoit les demandes
#   plus tard : RESEND_API_KEY, ALERTES_EXPEDITEUR, STRIPE_SECRET_KEY
#   facultatifs : CRENO_SEL, ALERTES_LIEN_STRIPE (vide = alertes gratuites), PACK_MONTANT_CENTIMES,
#                 AUTH_CONFIRMER_EMAILS (oui = confirmer l'e-mail à l'inscription, seulement quand Resend marche)
# Ces secrets restent cachés : personne ne peut les relire, pas même toi.
name: Brancher Supabase

on:
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - "scripts/migrer_supabase.py"
      - ".github/workflows/brancher-supabase.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: brancher-supabase
  cancel-in-progress: false

jobs:
  supabase:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - name: Vérifier les secrets
        id: verif
        env:
          ADMIN_CODE: ${{ secrets.ADMIN_CODE }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
        run: |
          # Dit quels secrets GitHub voit (jamais leur valeur).
          {
            echo "## Brancher Supabase"
            echo ""
            for n in SUPABASE_ACCESS_TOKEN SUPABASE_PROJECT_ID ADMIN_CODE ADMIN_EMAIL; do
              if [ -n "${!n}" ]; then echo "- Secret trouvé : \`$n\`"; else echo "- **Secret manquant : \`$n\`**"; fi
            done
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_ID" ]; then
            echo "ok=non" >> "$GITHUB_OUTPUT"
            if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
              echo "::error::Rien n'a été fait : ajoute les secrets manquants dans GitHub (Settings > Secrets and variables > Actions), pas dans Vercel."
              exit 1
            fi
            exit 0
          fi
          # Accepte l'identifiant seul, l'adresse https://xxxx.supabase.co ou le lien du tableau de bord.
          PROJET=$(printf '%s' "$SUPABASE_PROJECT_ID" | tr -d '[:space:]' | sed -E 's#^https?://##; s#\.supabase\.co.*$##; s#^.*/project/##; s#/.*$##')
          echo "PROJET=$PROJET" >> "$GITHUB_ENV"
          echo "ok=oui" >> "$GITHUB_OUTPUT"
          # Petit outil pour les étapes suivantes : lance une commande, écrit le résultat dans Summary.
          cat > "$RUNNER_TEMP/etape.sh" <<'FIN'
          etape() {
            titre="$1"; shift
            sortie="$RUNNER_TEMP/sortie.txt"
            set +e
            "$@" > "$sortie" 2>&1
            code=$?
            set -e
            cat "$sortie"
            if [ "$code" -eq 0 ]; then
              echo "### ✅ $titre" >> "$GITHUB_STEP_SUMMARY"
            else
              {
                echo "### ❌ $titre"
                if grep -qiE "missing.?required|missing_permissions|status 403|HTTP 403" "$sortie"; then
                  echo ""
                  echo "👉 **Le jeton Supabase n'a pas assez de droits.** Recrée-le sur supabase.com (Access Tokens) avec ton projet et la permission « Full access », puis remplace le secret GitHub SUPABASE_ACCESS_TOKEN."
                  echo ""
                fi
                echo '```'
                # Sans les lignes de téléchargement Docker, et coupé pour se lire sur un téléphone.
                grep -vE '^[0-9a-f]{12}: |^Digest: |^Status: Downloaded' "$sortie" | tail -n 15 \
                  | sed "s/${SUPABASE_ACCESS_TOKEN:-jeton-absent}/***/g" | fold -w 70 -s
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
            fi
            return "$code"
          }
          FIN

      - uses: actions/checkout@v4
        if: steps.verif.outputs.ok == 'oui'

      - uses: supabase/setup-cli@v1
        if: steps.verif.outputs.ok == 'oui'
        with:
          version: 2.90.0

      - name: 1. Tables
        if: steps.verif.outputs.ok == 'oui'
        run: |
          . "$RUNNER_TEMP/etape.sh"
          etape "1. Tables" python3 scripts/migrer_supabase.py

      - name: 2. Fonctions serveur
        if: always() && steps.verif.outputs.ok == 'oui'
        run: |
          . "$RUNNER_TEMP/etape.sh"
          if ! etape "2. Fonctions serveur" supabase functions deploy --project-ref "$PROJET" --no-verify-jwt --use-api --yes; then
            if grep -qiE "missing.?required|403" "$RUNNER_TEMP/sortie.txt"; then
              exit 1   # problème de droits du jeton : un 2e essai ne changerait rien
            fi
            echo "Nouvel essai, avec Docker pour préparer les fonctions."
            etape "2. Fonctions serveur (2e essai)" supabase functions deploy --project-ref "$PROJET" --no-verify-jwt --yes
          fi

      - name: 3. Secrets des fonctions
        if: always() && steps.verif.outputs.ok == 'oui'
        env:
          ADMIN_CODE: ${{ secrets.ADMIN_CODE }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          CRENO_SEL: ${{ secrets.CRENO_SEL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERTES_EXPEDITEUR: ${{ secrets.ALERTES_EXPEDITEUR }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          ALERTES_LIEN_STRIPE: ${{ secrets.ALERTES_LIEN_STRIPE }}
          PACK_MONTANT_CENTIMES: ${{ secrets.PACK_MONTANT_CENTIMES }}
          ALERTES_MONTANT_CENTIMES: ${{ secrets.ALERTES_MONTANT_CENTIMES }}
        run: |
          . "$RUNNER_TEMP/etape.sh"
          args=()
          noms=""
          for n in ADMIN_CODE ADMIN_EMAIL CRENO_SEL RESEND_API_KEY ALERTES_EXPEDITEUR STRIPE_SECRET_KEY \
                   ALERTES_LIEN_STRIPE PACK_MONTANT_CENTIMES ALERTES_MONTANT_CENTIMES; do
            # Enlève les retours à la ligne et les espaces collés par erreur au début ou à la fin.
            v=$(printf '%s' "${!n}" | tr -d '\r\n' | sed -E 's/^[[:space:]]+//; s/[[:space:]]+$//')
            if [ -n "$v" ]; then
              args+=("$n=$v")
              noms="$noms $n"
            fi
          done
          if [ ${#args[@]} -eq 0 ]; then
            echo "### ⚪ 3. Secrets des fonctions : aucun sur GitHub pour l'instant" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "Copiés dans Supabase :$noms"
          etape "3. Secrets des fonctions :$noms" supabase secrets set --project-ref "$PROJET" "${args[@]}"

      - name: 5. Comptes (connexion)
        if: always() && steps.verif.outputs.ok == 'oui'
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERTES_EXPEDITEUR: ${{ secrets.ALERTES_EXPEDITEUR }}
          AUTH_CONFIRMER_EMAILS: ${{ secrets.AUTH_CONFIRMER_EMAILS }}
        run: |
          . "$RUNNER_TEMP/etape.sh"
          # Réglages de Supabase Auth : adresse du site, mot de passe de 8 caractères au moins.
          # Sans e-mails branchés, pas de confirmation à l'inscription (sinon personne ne pourrait se connecter).
          # Avec RESEND_API_KEY et ALERTES_EXPEDITEUR : Supabase envoie ses e-mails (mot de passe oublié) par Resend.
          python3 - > "$RUNNER_TEMP/auth.json" <<'FIN'
          import json, os, re
          site = json.load(open("site.json"))["adresse_du_site"].rstrip("/")
          c = {"site_url": site, "uri_allow_list": site + "/**", "external_email_enabled": True,
               "disable_signup": False, "password_min_length": 8,
               "mailer_autoconfirm": os.environ.get("AUTH_CONFIRMER_EMAILS", "").strip().lower() != "oui"}
          cle, exp = os.environ.get("RESEND_API_KEY", "").strip(), os.environ.get("ALERTES_EXPEDITEUR", "").strip()
          m = re.search(r"<([^>]+)>", exp)
          adresse = m.group(1) if m else exp
          if cle and "@" in adresse:
              c.update({"smtp_host": "smtp.resend.com", "smtp_port": "465", "smtp_user": "resend", "smtp_pass": cle,
                        "smtp_admin_email": adresse, "smtp_sender_name": "Créno"})
          print(json.dumps(c))
          FIN
          rep="$RUNNER_TEMP/auth-reponse.json"
          if ! etape "5. Comptes (connexion)" curl -sS --fail-with-body -X PATCH "https://api.supabase.com/v1/projects/$PROJET/config/auth" \
               -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" --data @"$RUNNER_TEMP/auth.json" -o "$rep"; then
            { echo '```'; head -c 600 "$rep" | fold -w 70 -s; echo; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            rm -f "$RUNNER_TEMP/auth.json" "$rep"
            exit 1
          fi
          rm -f "$RUNNER_TEMP/auth.json" "$rep"

      - name: 4. Remplir assets/config.js
        if: always() && steps.verif.outputs.ok == 'oui'
        run: |
          if ! grep -q 'supabaseUrl: ""' assets/config.js; then
            echo "### ✅ 4. Site branché (assets/config.js déjà rempli)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if ! supabase projects api-keys --project-ref "$PROJET" -o json > "$RUNNER_TEMP/cles.json" \
             || ! CLE=$(python3 scripts/cle_supabase.py publique < "$RUNNER_TEMP/cles.json"); then
            echo "### ❌ 4. Clé publique introuvable : envoie à Claude la clé publishable de Supabase" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          sed -i "s#supabaseUrl: \"\"#supabaseUrl: \"https://$PROJET.supabase.co\"#; s#supabaseAnonKey: \"\"#supabaseAnonKey: \"$CLE\"#" assets/config.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/config.js
          git commit -m "Brancher le site à Supabase (adresse et clé publique)"
          git pull --rebase
          git push
          echo "### ✅ 4. Site branché (assets/config.js rempli)" >> "$GITHUB_STEP_SUMMARY"
