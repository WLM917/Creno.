# Créno : met à jour les prix du site chaque jour, tout seul.
#
# Lit dans Supabase les prix déclarés par les élèves et les tarifs des auto-écoles que tu as
# validés (bouton « Publier » du tableau de bord), régénère les pages, puis publie si quelque
# chose a changé. Vercel met alors le site à jour.
#
# Utilise les mêmes secrets GitHub que « Brancher Supabase » : SUPABASE_ACCESS_TOKEN et
# SUPABASE_PROJECT_ID suffisent (la clé service_role est retrouvée toute seule, jamais affichée).
# Si ça ne marche pas, ajoute en plus les secrets SUPABASE_URL (https://xxxx.supabase.co)
# et SUPABASE_SERVICE_KEY (clé service_role ou secret de Supabase, jamais dans le code).
# Pour lancer une mise à jour tout de suite : onglet Actions > « Mettre à jour les prix » > Run workflow.
name: Mettre à jour les prix

on:
  schedule:
    - cron: "23 4 * * *"   # chaque jour vers 5 h 23 (heure de Paris en hiver)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mise-a-jour-prix
  cancel-in-progress: false

jobs:
  prix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Besoin de l'outil Supabase ?
        id: prep
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          if [ -z "$SUPABASE_SERVICE_KEY" ] && [ -n "$SUPABASE_ACCESS_TOKEN" ] && [ -n "$SUPABASE_PROJECT_ID" ]; then
            echo "cli=oui" >> "$GITHUB_OUTPUT"
          fi
      - uses: supabase/setup-cli@v1
        if: steps.prep.outputs.cli == 'oui'
        with:
          version: 2.90.0
      - name: Lire Supabase et régénérer le site
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          PROJET=$(printf '%s' "$SUPABASE_PROJECT_ID" | tr -d '[:space:]' | sed -E 's#^https?://##; s#\.supabase\.co.*$##; s#^.*/project/##; s#/.*$##')
          if [ -z "$SUPABASE_URL" ] && [ -n "$PROJET" ]; then
            export SUPABASE_URL="https://$PROJET.supabase.co"
          fi
          if [ -z "$SUPABASE_SERVICE_KEY" ] && [ -n "$SUPABASE_ACCESS_TOKEN" ] && [ -n "$PROJET" ]; then
            if supabase projects api-keys --project-ref "$PROJET" -o json > "$RUNNER_TEMP/cles.json"; then
              if CLE=$(python3 scripts/cle_supabase.py secrete < "$RUNNER_TEMP/cles.json"); then
                echo "::add-mask::$CLE"
                export SUPABASE_SERVICE_KEY="$CLE"
              fi
            else
              # Jeton refusé (expiré ou supprimé) : on le dit en rouge au lieu de ne rien faire en silence.
              rm -f "$RUNNER_TEMP/cles.json"
              {
                echo "### ❌ Le jeton Supabase ne marche plus"
                echo "Les prix n'ont pas pu être lus. Crée un nouveau jeton dans Supabase (Account > Access Tokens, ton projet, « Full access »),"
                echo "remplace le secret GitHub SUPABASE_ACCESS_TOKEN, puis relance « Brancher Supabase »."
              } >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            rm -f "$RUNNER_TEMP/cles.json"
          fi
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_KEY" ]; then
            echo "Secrets Supabase pas encore réglés : rien à faire."
            exit 0
          fi
          python3 scripts/sync_prix.py
      - name: Publier si quelque chose a changé
        run: |
          rm -rf scripts/__pycache__
          git add -A
          if git diff --cached --quiet; then
            echo "Rien de nouveau."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Prix et tarifs mis à jour depuis Supabase"
          git push
