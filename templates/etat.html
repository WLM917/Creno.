<div class="wrap stack-lg page-pad">
  <header class="view-head">
    <h1>{{titre}}</h1>
    <p class="lede" id="etat-msg" data-etat="{{etat}}" role="status">{{attente}}</p>
  </header>
  <div class="etat-actions" id="etat-actions" hidden>
    <a class="btn btn-signal" id="etat-bouton" href="#">Télécharger</a>
  </div>
  <p class="small" id="etat-note" hidden></p>
  <a class="link-strong" href="{{root}}{{retour_url}}">{{retour_txt}}</a>
</div>
